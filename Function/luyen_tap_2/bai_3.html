<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <script>
      function tinhGiaiThua(n) {
          if (n === 0 || n === 1) {
              return 1;
          }
          return n * tinhGiaiThua(n - 1);
      }

      let n = +prompt("Nhập n:");
      document.write(tinhGiaiThua(n));

  </script>
</head>

</body>
</html>
