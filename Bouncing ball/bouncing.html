<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #111;
            border: 2px solid #fff;
        }
        #scoreboard {
            position: absolute;
            top: 10px;
            font-size: 20px;
        }
        #game-over {
            display: none;
            font-size: 30px;
            color: red;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="scoreboard">Score: 0</div>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="game-over">
    <p>Game Over!</p>
    <button onclick="startGame()">Play Again</button>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreboard = document.getElementById("scoreboard");
    const gameOverText = document.getElementById("game-over");

    const BALL_RADIUS = 10;
    const BAR_WIDTH = 80;
    const BAR_HEIGHT = 10;
    const BAR_SPEED = 5;

    let ball, bar, score, isGameOver, startTime;

    class Ball {
        constructor(x, y, dx, dy) {
            this.x = x;
            this.y = y;
            this.dx = dx;
            this.dy = dy;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "orange";
            ctx.fill();
            ctx.closePath();
        }

        update() {
            // Kiểm tra va chạm với các biên
            if (this.x + this.dx < BALL_RADIUS || this.x + this.dx > canvas.width - BALL_RADIUS) {
                this.dx = -this.dx;
            }
            if (this.y + this.dy < BALL_RADIUS) {
                this.dy = -this.dy;
            }

            // Kiểm tra va chạm với thanh đỡ
            if (
                this.y + BALL_RADIUS >= bar.y &&
                this.x > bar.x &&
                this.x < bar.x + BAR_WIDTH
            ) {
                this.dy = -this.dy;

                // Thay đổi góc tùy theo tốc độ thanh đỡ
                const hitPos = (this.x - bar.x - BAR_WIDTH / 2) / (BAR_WIDTH / 2);
                this.dx += hitPos * 0.5 * bar.dx;
            }

            // Kiểm tra game over nếu chạm biên dưới
            if (this.y + BALL_RADIUS >= canvas.height) {
                isGameOver = true;
            }

            this.x += this.dx;
            this.y += this.dy;
        }
    }

    class Bar {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.dx = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.rect(this.x, this.y, BAR_WIDTH, BAR_HEIGHT);
            ctx.fillStyle = "lightblue";
            ctx.fill();
            ctx.closePath();
        }

        update() {
            this.x += this.dx;

            // Kiểm tra va chạm với biên trái và phải
            if (this.x < 0) {
                this.x = 0;
            } else if (this.x + BAR_WIDTH > canvas.width) {
                this.x = canvas.width - BAR_WIDTH;
            }
        }

        moveLeft() {
            this.dx = -BAR_SPEED;
        }

        moveRight() {
            this.dx = BAR_SPEED;
        }

        stop() {
            this.dx = 0;
        }
    }

    function startGame() {
        ball = new Ball(canvas.width / 2, canvas.height / 2, 2, -3);
        bar = new Bar((canvas.width - BAR_WIDTH) / 2, canvas.height - 30);
        score = 0;
        isGameOver = false;
        startTime = Date.now();
        gameOverText.style.display = "none";
        animate();
    }

    function updateScore() {
        const currentTime = Date.now();
        score = Math.floor((currentTime - startTime) / 1000);
        scoreboard.textContent = `Score: ${score}`;
    }

    function gameOver() {
        gameOverText.style.display = "block";
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!isGameOver) {
            ball.update();
            bar.update();
            updateScore();
        } else {
            gameOver();
            return;
        }

        ball.draw();
        bar.draw();

        requestAnimationFrame(animate);
    }

    // Điều khiển thanh đỡ bằng phím mũi tên
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
            bar.moveLeft();
        } else if (e.key === "ArrowRight") {
            bar.moveRight();
        }
    });

    document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            bar.stop();
        }
    });

    startGame();
</script>
</body>
</html>
